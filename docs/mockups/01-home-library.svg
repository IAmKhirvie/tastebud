<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="-apple-system, SF Pro Display, Segoe UI, Roboto, sans-serif">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000" flood-opacity="0.06"/>
    </filter>
    <filter id="liftShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="nowPlayingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1f1f1f"/>
    </linearGradient>
    <linearGradient id="albumArt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8a6f1c"/>
    </linearGradient>
  </defs>

  <!-- Device frame -->
  <rect x="0" y="0" width="390" height="844" rx="44" fill="#000"/>
  <rect x="6" y="6" width="378" height="832" rx="38" fill="#FFFFFF"/>

  <!-- Dynamic Island -->
  <rect x="155" y="14" width="80" height="22" rx="11" fill="#000"/>

  <!-- Status bar -->
  <text x="30" y="32" font-size="14" font-weight="600" fill="#000">9:41</text>
  <g transform="translate(310,22)" fill="#000">
    <rect x="0" y="2" width="14" height="10" rx="1"/>
    <rect x="18" y="0" width="3" height="12" rx="0.5"/>
    <rect x="24" y="2" width="20" height="8" rx="2"/>
  </g>

  <!-- HEADER -->
  <text x="24" y="80" font-size="32" font-weight="800" fill="#000" letter-spacing="-1">TasteBud</text>
  <text x="24" y="102" font-size="12" fill="#7a7a7a">Music Taste Made for Your Earbuds</text>
  <circle cx="350" cy="80" r="18" fill="#000"/>
  <text x="350" y="86" font-size="13" font-weight="700" fill="#D4AF37" text-anchor="middle">K</text>

  <!-- SEARCH -->
  <rect x="24" y="124" width="342" height="48" rx="24" fill="#F4F4F4"/>
  <circle cx="50" cy="148" r="7" fill="none" stroke="#000" stroke-width="1.8"/>
  <line x1="55" y1="153" x2="60" y2="158" stroke="#000" stroke-width="1.8" stroke-linecap="round"/>
  <text x="72" y="153" font-size="14" fill="#999">Search songs, artists, moods…</text>

  <!-- MOODS (under search) -->
  <text x="24" y="208" font-size="13" font-weight="700" fill="#000" letter-spacing="0.5">MOODS</text>
  <text x="366" y="208" font-size="11" fill="#888" text-anchor="end">Edit</text>

  <g transform="translate(24,222)">
    <rect x="0" y="0" width="78" height="40" rx="20" fill="#FFFFFF" stroke="#D4AF37" stroke-width="2"/>
    <circle cx="18" cy="20" r="6" fill="#87CEEB"/>
    <text x="32" y="25" font-size="13" font-weight="600" fill="#000">Chill</text>

    <rect x="88" y="0" width="78" height="40" rx="20" fill="#F4F4F4"/>
    <circle cx="106" cy="20" r="6" fill="#FFD93D"/>
    <text x="120" y="25" font-size="13" font-weight="500" fill="#000">Happy</text>

    <rect x="176" y="0" width="78" height="40" rx="20" fill="#F4F4F4"/>
    <circle cx="194" cy="20" r="6" fill="#4CAF50"/>
    <text x="208" y="25" font-size="13" font-weight="500" fill="#000">Focus</text>

    <rect x="264" y="0" width="64" height="40" rx="20" fill="#F4F4F4"/>
    <circle cx="282" cy="20" r="6" fill="#1E5AAF"/>
    <text x="296" y="25" font-size="13" font-weight="500" fill="#000">Sad</text>
  </g>

  <g transform="translate(24,272)">
    <rect x="0" y="0" width="78" height="40" rx="20" fill="#F4F4F4"/>
    <circle cx="18" cy="20" r="6" fill="#FF7043"/>
    <text x="32" y="25" font-size="13" font-weight="500" fill="#000">Hype</text>

    <rect x="88" y="0" width="110" height="40" rx="20" fill="#F4F4F4"/>
    <circle cx="106" cy="20" r="6" fill="#EC407A"/>
    <text x="120" y="25" font-size="13" font-weight="500" fill="#000">Romantic</text>

    <rect x="208" y="0" width="80" height="40" rx="20" fill="#F4F4F4" stroke="#000" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="222" y="26" font-size="16" fill="#000">＋</text>
    <text x="240" y="25" font-size="12" font-weight="500" fill="#000">Add</text>
  </g>

  <!-- NOW PLAYING -->
  <text x="24" y="356" font-size="13" font-weight="700" fill="#000" letter-spacing="0.5">NOW PLAYING</text>

  <g filter="url(#liftShadow)">
    <rect x="24" y="370" width="342" height="108" rx="20" fill="url(#nowPlayingGrad)"/>
  </g>
  <rect x="38" y="384" width="80" height="80" rx="12" fill="url(#albumArt)"/>
  <text x="62" y="436" font-size="32" fill="#fff" opacity="0.35">♪</text>

  <text x="132" y="404" font-size="10" font-weight="700" fill="#D4AF37" letter-spacing="1">PLAYING</text>
  <text x="132" y="424" font-size="17" font-weight="700" fill="#fff">Midnight Drive</text>
  <text x="132" y="442" font-size="12" fill="#bbb">Lo-fi Nights</text>

  <rect x="132" y="456" width="160" height="3" rx="1.5" fill="#444"/>
  <rect x="132" y="456" width="58" height="3" rx="1.5" fill="#D4AF37"/>

  <circle cx="338" cy="424" r="22" fill="#D4AF37"/>
  <polygon points="332,414 332,434 350,424" fill="#000"/>

  <!-- TASTE DECK SHORTCUT -->
  <g filter="url(#cardShadow)">
    <rect x="24" y="496" width="342" height="92" rx="20" fill="#FFFFFF" stroke="#000" stroke-width="1.5"/>
  </g>
  <rect x="38" y="510" width="64" height="64" rx="14" fill="#000"/>
  <rect x="50" y="522" width="34" height="40" rx="5" fill="none" stroke="#D4AF37" stroke-width="2"/>
  <rect x="54" y="518" width="34" height="40" rx="5" fill="none" stroke="#D4AF37" stroke-width="2" opacity="0.6"/>
  <rect x="58" y="514" width="34" height="40" rx="5" fill="#D4AF37"/>

  <text x="118" y="530" font-size="16" font-weight="700" fill="#000">Open Taste Deck</text>
  <text x="118" y="548" font-size="12" fill="#666">Swipe through your music as cards</text>
  <text x="118" y="568" font-size="11" font-weight="600" fill="#D4AF37">47 cards in deck  →</text>

  <!-- RECENTLY PLAYED -->
  <text x="24" y="624" font-size="13" font-weight="700" fill="#000" letter-spacing="0.5">RECENTLY PLAYED</text>
  <text x="366" y="624" font-size="11" fill="#888" text-anchor="end">See all</text>

  <g transform="translate(24,638)">
    <rect width="342" height="56" rx="14" fill="#FAFAFA"/>
    <rect x="8" y="8" width="40" height="40" rx="8" fill="#EC407A"/>
    <text x="20" y="34" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">G</text>
    <text x="58" y="28" font-size="14" font-weight="600" fill="#000">Golden Hour</text>
    <text x="58" y="44" font-size="11" fill="#777">Sunset Crew · 3:24</text>
    <circle cx="280" cy="28" r="4" fill="#EC407A"/>
    <text x="288" y="32" font-size="10" fill="#888">Romantic</text>
    <text x="320" y="33" font-size="14" fill="#000">⋯</text>
  </g>

  <g transform="translate(24,702)">
    <rect width="342" height="56" rx="14" fill="#FAFAFA"/>
    <rect x="8" y="8" width="40" height="40" rx="8" fill="#1f1f1f"/>
    <text x="20" y="34" font-size="16" fill="#D4AF37" font-weight="700" text-anchor="middle">M</text>
    <text x="58" y="28" font-size="14" font-weight="600" fill="#000">Midnight Drive</text>
    <text x="58" y="44" font-size="11" fill="#777">Lo-fi Nights · 3:42</text>
    <circle cx="240" cy="28" r="4" fill="#87CEEB"/>
    <circle cx="252" cy="28" r="4" fill="#4CAF50"/>
    <text x="264" y="32" font-size="10" fill="#888">Chill, Focus</text>
    <text x="320" y="33" font-size="14" fill="#000">⋯</text>
  </g>

  <!-- BOTTOM NAV -->
  <rect x="0" y="772" width="390" height="72" fill="#FFFFFF"/>
  <line x1="0" y1="772" x2="390" y2="772" stroke="#EEEEEE" stroke-width="1"/>

  <g transform="translate(40,790)">
    <path d="M0,12 L10,2 L20,12 L20,22 L0,22 Z" fill="#000"/>
  </g>
  <text x="50" y="828" font-size="10" font-weight="700" fill="#000" text-anchor="middle">Home</text>
  <circle cx="50" cy="836" r="2" fill="#D4AF37"/>

  <g transform="translate(135,790)">
    <rect x="2" y="4" width="14" height="18" rx="2" fill="none" stroke="#999" stroke-width="1.6"/>
    <rect x="6" y="0" width="14" height="18" rx="2" fill="none" stroke="#999" stroke-width="1.6"/>
  </g>
  <text x="145" y="828" font-size="10" fill="#999" text-anchor="middle">Taste Deck</text>

  <g transform="translate(232,790)" stroke="#999" stroke-width="1.6" fill="none">
    <line x1="0" y1="2" x2="0" y2="22"/>
    <line x1="6" y1="0" x2="6" y2="22"/>
    <line x1="12" y1="4" x2="14" y2="20"/>
  </g>
  <text x="240" y="828" font-size="10" fill="#999" text-anchor="middle">Library</text>

  <g transform="translate(330,790)" stroke="#999" stroke-width="1.6" fill="none">
    <circle cx="10" cy="6" r="5"/>
    <path d="M2,22 Q10,12 18,22"/>
  </g>
  <text x="340" y="828" font-size="10" fill="#999" text-anchor="middle">Profile</text>
</svg>
