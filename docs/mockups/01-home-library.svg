<svg xmlns="http://www.w3.org/2000/svg" width="380" height="800" viewBox="0 0 380 800" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <!-- Phone frame -->
  <rect x="0" y="0" width="380" height="800" rx="36" fill="#1a1a1a"/>
  <rect x="8" y="8" width="364" height="784" rx="30" fill="#ffffff"/>

  <!-- Status bar -->
  <text x="28" y="36" font-size="13" font-weight="600" fill="#000">9:41</text>
  <text x="328" y="36" font-size="13" fill="#000">●●●●</text>

  <!-- App header -->
  <text x="28" y="78" font-size="28" font-weight="700" fill="#000">TasteBud</text>
  <text x="28" y="98" font-size="12" fill="#888">Music Taste Made for Your Earbuds</text>
  <circle cx="345" cy="72" r="16" fill="#f5f5f5"/>
  <text x="340" y="77" font-size="14" fill="#000">⚙</text>

  <!-- Search bar -->
  <rect x="20" y="118" width="340" height="44" rx="22" fill="#f5f5f5"/>
  <text x="44" y="146" font-size="14" fill="#999">🔍  Search songs, artists, moods…</text>

  <!-- Now Playing card -->
  <rect x="20" y="180" width="340" height="100" rx="16" fill="#000"/>
  <rect x="32" y="192" width="76" height="76" rx="10" fill="#D4AF37"/>
  <text x="58" y="238" font-size="28" fill="#000">♪</text>
  <text x="124" y="208" font-size="11" fill="#D4AF37" font-weight="600">NOW PLAYING</text>
  <text x="124" y="230" font-size="16" font-weight="700" fill="#fff">Midnight Drive</text>
  <text x="124" y="248" font-size="12" fill="#bbb">Lo-fi Nights</text>
  <circle cx="155" cy="266" r="5" fill="#87CEEB"/>
  <text x="166" y="270" font-size="10" fill="#87CEEB">Chill</text>
  <circle cx="200" cy="266" r="5" fill="#4CAF50"/>
  <text x="211" y="270" font-size="10" fill="#4CAF50">Focus</text>
  <circle cx="328" cy="230" r="20" fill="#D4AF37"/>
  <text x="322" y="237" font-size="18" fill="#000">▶</text>

  <!-- Taste Deck shortcut -->
  <rect x="20" y="296" width="340" height="80" rx="16" fill="#fff" stroke="#000" stroke-width="2"/>
  <rect x="32" y="308" width="56" height="56" rx="8" fill="#000"/>
  <text x="48" y="344" font-size="22" fill="#D4AF37">🎴</text>
  <text x="100" y="328" font-size="15" font-weight="700" fill="#000">Open Taste Deck</text>
  <text x="100" y="346" font-size="11" fill="#666">Swipe through your music as cards</text>
  <text x="100" y="362" font-size="11" fill="#D4AF37">Tap to enter →</text>

  <!-- Section: Recently Played -->
  <text x="28" y="408" font-size="15" font-weight="700" fill="#000">Recently Played</text>
  <text x="332" y="408" font-size="11" fill="#888">See all</text>

  <!-- Recently played row -->
  <g transform="translate(20,420)">
    <rect width="340" height="60" rx="12" fill="#fafafa"/>
    <rect x="10" y="10" width="40" height="40" rx="6" fill="#EC407A"/>
    <text x="22" y="38" font-size="16" fill="#fff">♥</text>
    <text x="62" y="32" font-size="14" font-weight="600" fill="#000">Golden Hour</text>
    <text x="62" y="48" font-size="11" fill="#888">Sunset Crew · 3:24</text>
    <circle cx="280" cy="30" r="4" fill="#EC407A"/>
    <text x="290" y="34" font-size="10" fill="#EC407A">Romantic</text>
  </g>

  <g transform="translate(20,488)">
    <rect width="340" height="60" rx="12" fill="#fafafa"/>
    <rect x="10" y="10" width="40" height="40" rx="6" fill="#FF7043"/>
    <text x="24" y="38" font-size="18" fill="#fff">⚡</text>
    <text x="62" y="32" font-size="14" font-weight="600" fill="#000">Pulse Wave</text>
    <text x="62" y="48" font-size="11" fill="#888">Vivid Synth · 4:01</text>
    <circle cx="280" cy="30" r="4" fill="#FF7043"/>
    <text x="290" y="34" font-size="10" fill="#FF7043">Hype</text>
  </g>

  <!-- Section: Mood Collections -->
  <text x="28" y="580" font-size="15" font-weight="700" fill="#000">Moods</text>

  <g transform="translate(20,594)">
    <rect width="78" height="78" rx="14" fill="#87CEEB"/>
    <text x="20" y="44" font-size="22" fill="#fff">😌</text>
    <text x="20" y="68" font-size="11" font-weight="700" fill="#fff">Chill</text>
  </g>
  <g transform="translate(108,594)">
    <rect width="78" height="78" rx="14" fill="#FFD93D"/>
    <text x="20" y="44" font-size="22">😊</text>
    <text x="18" y="68" font-size="11" font-weight="700" fill="#000">Happy</text>
  </g>
  <g transform="translate(196,594)">
    <rect width="78" height="78" rx="14" fill="#4CAF50"/>
    <text x="20" y="44" font-size="22" fill="#fff">🎯</text>
    <text x="20" y="68" font-size="11" font-weight="700" fill="#fff">Focus</text>
  </g>
  <g transform="translate(284,594)">
    <rect width="78" height="78" rx="14" fill="#EC407A"/>
    <text x="14" y="44" font-size="22" fill="#fff">💗</text>
    <text x="8" y="68" font-size="11" font-weight="700" fill="#fff">Romantic</text>
  </g>

  <!-- Bottom Nav -->
  <rect x="0" y="720" width="380" height="80" rx="0" fill="#fff" stroke="#eee" stroke-width="1"/>
  <text x="42" y="755" font-size="22">🏠</text>
  <text x="36" y="775" font-size="10" font-weight="700" fill="#000">Home</text>

  <text x="128" y="755" font-size="22">🎴</text>
  <text x="118" y="775" font-size="10" fill="#888">Taste Deck</text>

  <text x="218" y="755" font-size="22">📚</text>
  <text x="208" y="775" font-size="10" fill="#888">Library</text>

  <text x="310" y="755" font-size="22">👤</text>
  <text x="304" y="775" font-size="10" fill="#888">Profile</text>
</svg>
