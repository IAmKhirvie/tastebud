<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="-apple-system, SF Pro Display, Segoe UI, Roboto, sans-serif">
  <defs>
    <pattern id="gridPlus" x="0" y="0" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M26,22 L30,22 M28,20 L28,24" stroke="#3a3a3a" stroke-width="1"/>
    </pattern>
    <radialGradient id="vinyl" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="40%" stop-color="#000"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#7a5d12"/>
    </linearGradient>
    <radialGradient id="labelGrad">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8a6f1c"/>
    </radialGradient>
    <filter id="cardShadow"><feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000" flood-opacity="0.55"/></filter>
  </defs>

  <rect width="390" height="844" fill="#0a0a0a"/>
  <rect width="390" height="844" fill="url(#gridPlus)"/>

  <text x="30" y="32" font-size="14" font-weight="600" fill="#fff">9:41</text>
  <g transform="translate(310,22)" fill="#fff"><rect y="2" width="14" height="10" rx="1"/><rect x="18" width="3" height="12" rx="0.5"/><rect x="24" y="2" width="20" height="8" rx="2"/></g>
  <text x="30" y="74" font-size="22" fill="#fff">⌄</text>
  <text x="195" y="74" font-size="10" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="2">TASTE DECK · VINYL</text>
  <text x="360" y="74" font-size="20" fill="#fff" text-anchor="end">⋯</text>

  <!-- CARD body -->
  <g filter="url(#cardShadow)">
    <rect x="32" y="106" width="326" height="660" rx="22" fill="#FFFFFF"/>
  </g>
  <rect x="40" y="114" width="310" height="644" rx="18" fill="none" stroke="#000" stroke-width="0.6" opacity="0.12"/>

  <!-- Top crest + title -->
  <g transform="translate(195,118)">
    <path d="M-2,18 Q-30,-2 -68,2 Q-58,18 -38,26 Q-20,30 -8,26 Z" fill="url(#gold)" stroke="#5a4612" stroke-width="0.8"/>
    <path d="M2,18 Q30,-2 68,2 Q58,18 38,26 Q20,30 8,26 Z" fill="url(#gold)" stroke="#5a4612" stroke-width="0.8"/>
    <polygon points="0,-8 13,0 13,16 0,24 -13,16 -13,0" fill="url(#gold)" stroke="#5a4612" stroke-width="1"/>
    <text x="0" y="13" font-size="14" font-weight="900" fill="#000" text-anchor="middle">B</text>
  </g>

  <text x="195" y="180" font-size="22" font-weight="900" fill="#000" text-anchor="middle" letter-spacing="3">MIDNIGHT DRIVE</text>
  <text x="195" y="200" font-size="11" fill="#666" text-anchor="middle" letter-spacing="2">SIDE A · 33⅓ RPM</text>

  <!-- Vinyl record -->
  <g transform="translate(195,400)">
    <circle r="160" fill="url(#vinyl)"/>
    <!-- Grooves -->
    <g fill="none" stroke="#1a1a1a" stroke-width="0.6">
      <circle r="150"/><circle r="140"/><circle r="130"/><circle r="120"/><circle r="110"/>
      <circle r="100"/><circle r="90"/><circle r="80"/>
    </g>
    <!-- Light reflection -->
    <path d="M-140,0 A140,140 0 0 1 0,-140" fill="none" stroke="#fff" stroke-width="0.8" opacity="0.18"/>
    <path d="M-100,40 A100,100 0 0 1 40,-100" fill="none" stroke="#fff" stroke-width="0.6" opacity="0.12"/>
    <!-- Center label -->
    <circle r="60" fill="url(#labelGrad)"/>
    <circle r="60" fill="none" stroke="#000" stroke-width="1"/>
    <text x="0" y="-20" font-size="9" font-weight="800" fill="#000" text-anchor="middle" letter-spacing="2">LO-FI NIGHTS</text>
    <line x1="-44" y1="-12" x2="44" y2="-12" stroke="#000" stroke-width="0.5"/>
    <text x="0" y="6" font-size="14" font-weight="900" fill="#000" text-anchor="middle">MIDNIGHT</text>
    <text x="0" y="22" font-size="14" font-weight="900" fill="#000" text-anchor="middle">DRIVE</text>
    <line x1="-44" y1="32" x2="44" y2="32" stroke="#000" stroke-width="0.5"/>
    <text x="0" y="44" font-size="7" fill="#000" text-anchor="middle">TRACK 03 · 3:42</text>
    <!-- spindle -->
    <circle r="5" fill="#000"/>
    <circle r="2" fill="#D4AF37"/>
  </g>

  <!-- Mood bar -->
  <rect x="64" y="588" width="262" height="24" rx="2" fill="#000"/>
  <text x="195" y="604" font-size="11" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="3">CHILL · FOCUS · LATE NIGHT</text>

  <!-- Description -->
  <text x="64" y="638" font-size="11" font-weight="700" fill="#000">Synced lyrics available.</text>
  <text x="64" y="654" font-size="10" fill="#444">Tap card to flip — read along.</text>
  <text x="64" y="670" font-size="10" fill="#444">Swipe ↑ to favorite · Hold for actions.</text>

  <!-- Bottom stat pills -->
  <g transform="translate(64,692)">
    <rect width="124" height="38" rx="6" fill="#000"/>
    <text x="14" y="25" font-size="15" fill="#D4AF37">⏱</text>
    <text x="110" y="26" font-size="17" font-weight="800" fill="#fff" text-anchor="end">3:42</text>
  </g>
  <g transform="translate(202,692)">
    <rect width="124" height="38" rx="6" fill="#000"/>
    <text x="14" y="26" font-size="17" font-weight="800" fill="#fff">87</text>
    <text x="46" y="25" font-size="11" fill="#bbb">plays</text>
    <polygon points="106,12 106,26 116,19" fill="#D4AF37"/>
  </g>

  <!-- Corner badges -->
  <rect x="48" y="124" width="44" height="20" rx="10" fill="#000"/>
  <text x="70" y="138" font-size="9" font-weight="800" fill="#D4AF37" text-anchor="middle">LRC ✓</text>
  <circle cx="332" cy="134" r="14" fill="#000"/>
  <text x="332" y="140" font-size="14" fill="#EC407A" text-anchor="middle">♥</text>
  <text x="334" y="754" font-size="8" fill="#888" text-anchor="end">No. 0003</text>

  <!-- Mini controls -->
  <g transform="translate(0,792)">
    <g transform="translate(110,4)" fill="#fff"><polygon points="14,0 14,20 0,10"/><rect x="14" width="3" height="20"/></g>
    <circle cx="195" cy="14" r="22" fill="#D4AF37"/>
    <polygon points="189,4 189,24 207,14" fill="#000"/>
    <g transform="translate(254,4)" fill="#fff"><polygon points="0,0 0,20 14,10"/><rect x="14" width="3" height="20"/></g>
  </g>
  <text x="195" y="832" font-size="9" fill="#666" text-anchor="middle" font-style="italic">Tap to flip · Swipe ↓ to exit</text>
</svg>
