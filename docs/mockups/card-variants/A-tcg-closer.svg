<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="-apple-system, SF Pro Display, Segoe UI, Roboto, sans-serif">
  <defs>
    <pattern id="gridPlus" x="0" y="0" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M26,22 L30,22 M28,20 L28,24" stroke="#3a3a3a" stroke-width="1"/>
    </pattern>
    <linearGradient id="holo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9be3ff"/>
      <stop offset="40%" stop-color="#d6b8ff"/>
      <stop offset="75%" stop-color="#ffb3da"/>
      <stop offset="100%" stop-color="#ffe5a3"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#7a5d12"/>
    </linearGradient>
    <filter id="cardShadow"><feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000" flood-opacity="0.55"/></filter>
  </defs>

  <rect width="390" height="844" fill="#0a0a0a"/>
  <rect width="390" height="844" fill="url(#gridPlus)"/>

  <text x="30" y="32" font-size="14" font-weight="600" fill="#fff">9:41</text>
  <g transform="translate(310,22)" fill="#fff"><rect y="2" width="14" height="10" rx="1"/><rect x="18" width="3" height="12" rx="0.5"/><rect x="24" y="2" width="20" height="8" rx="2"/></g>
  <text x="30" y="74" font-size="22" fill="#fff">⌄</text>
  <text x="360" y="74" font-size="20" fill="#fff" text-anchor="end">⋯</text>

  <!-- ====== CARD (irregular silhouette) ====== -->
  <g filter="url(#cardShadow)">
    <path d="M40,180 L102,180 L120,164 L270,164 L288,180 L350,180 L350,236 L340,250 L340,694 L350,708 L350,752 L260,752 L244,766 L146,766 L130,752 L40,752 L40,708 L50,694 L50,250 L40,236 Z" fill="#FFFFFF"/>
  </g>
  <path d="M50,190 L106,190 L122,174 L268,174 L284,190 L340,190 L340,234 L332,244 L332,692 L340,704 L340,742 L256,742 L240,756 L150,756 L134,742 L50,742 L50,704 L58,692 L58,244 L50,234 Z" fill="none" stroke="#000" stroke-width="0.7" opacity="0.15"/>

  <!-- ====== GOLD WING CREST (extends ABOVE card edge) ====== -->
  <g transform="translate(195,162)">
    <!-- Left wing -->
    <path d="M-2,18 Q-30,-2 -68,2 Q-58,18 -38,26 Q-20,30 -8,26 Z" fill="url(#gold)" stroke="#5a4612" stroke-width="0.8"/>
    <path d="M-12,16 Q-32,8 -56,8" fill="none" stroke="#fff" stroke-width="0.6" opacity="0.6"/>
    <!-- Right wing -->
    <path d="M2,18 Q30,-2 68,2 Q58,18 38,26 Q20,30 8,26 Z" fill="url(#gold)" stroke="#5a4612" stroke-width="0.8"/>
    <path d="M12,16 Q32,8 56,8" fill="none" stroke="#fff" stroke-width="0.6" opacity="0.6"/>
    <!-- Center hex -->
    <polygon points="0,-8 13,0 13,16 0,24 -13,16 -13,0" fill="url(#gold)" stroke="#5a4612" stroke-width="1"/>
    <polygon points="0,-2 8,2 8,12 0,16 -8,12 -8,2" fill="none" stroke="#fff" stroke-width="1"/>
    <circle cx="0" cy="7" r="2" fill="#fff"/>
  </g>

  <!-- TITLE BANNER -->
  <g>
    <path d="M82,206 L308,206 L320,224 L308,242 L82,242 L70,224 Z" fill="#FFFFFF" stroke="#000" stroke-width="1.8"/>
    <text x="195" y="231" font-size="18" font-weight="900" fill="#000" text-anchor="middle" letter-spacing="4">MIDNIGHT DRIVE</text>
  </g>

  <!-- HOLOGRAPHIC ART WINDOW (big, dominant) -->
  <g>
    <rect x="64" y="258" width="262" height="356" rx="6" fill="url(#holo)"/>
    <!-- diagonal foil streaks -->
    <polygon points="64,440 130,258 200,258 110,614 64,614" fill="#fff" opacity="0.18"/>
    <polygon points="230,258 290,258 240,614 200,614" fill="#000" opacity="0.10"/>
    <!-- noise lines -->
    <g opacity="0.3" stroke="#fff" stroke-width="0.5">
      <line x1="64" y1="290" x2="326" y2="280"/>
      <line x1="64" y1="340" x2="326" y2="334"/>
      <line x1="64" y1="400" x2="326" y2="396"/>
      <line x1="64" y1="460" x2="326" y2="458"/>
      <line x1="64" y1="520" x2="326" y2="522"/>
      <line x1="64" y1="580" x2="326" y2="586"/>
    </g>
    <text x="195" y="470" font-size="220" fill="#fff" opacity="0.5" text-anchor="middle" font-weight="100">♪</text>
  </g>

  <!-- COST PILL (top-right of art) -->
  <g transform="translate(298,272)">
    <rect width="32" height="56" rx="16" fill="#000" stroke="#fff" stroke-width="1.5"/>
    <polygon points="16,12 19,21 28,21 21,27 24,36 16,30 8,36 11,27 4,21 13,21" fill="#D4AF37"/>
    <text x="16" y="50" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">3</text>
  </g>

  <!-- LRC + Heart -->
  <rect x="74" y="270" width="44" height="20" rx="10" fill="#000"/>
  <text x="96" y="284" font-size="9" font-weight="800" fill="#D4AF37" text-anchor="middle">LRC ✓</text>
  <circle cx="86" cy="600" r="14" fill="#000"/>
  <text x="86" y="606" font-size="14" fill="#EC407A" text-anchor="middle">♥</text>

  <!-- SIDE TAB (left) with barcode + vertical name -->
  <g>
    <path d="M40,632 L130,632 L130,700 L106,700 L106,720 L40,720 Z" fill="#FFFFFF" stroke="#000" stroke-width="1.5"/>
    <g fill="#000">
      <rect x="48" y="638" width="2" height="22"/><rect x="52" y="638" width="1" height="22"/><rect x="55" y="638" width="3" height="22"/>
      <rect x="60" y="638" width="1" height="22"/><rect x="63" y="638" width="2" height="22"/><rect x="67" y="638" width="1" height="22"/>
      <rect x="70" y="638" width="3" height="22"/><rect x="75" y="638" width="2" height="22"/><rect x="79" y="638" width="1" height="22"/>
      <rect x="82" y="638" width="2" height="22"/><rect x="86" y="638" width="3" height="22"/>
    </g>
    <text x="125" y="644" font-size="6" fill="#000" text-anchor="end">No. 0003</text>
    <text x="73" y="714" font-size="9" font-weight="800" fill="#000" transform="rotate(-90 73,714)">MIDNIGHT</text>
  </g>

  <!-- ARTIST DISC -->
  <g>
    <circle cx="170" cy="676" r="36" fill="#FFFFFF" stroke="#000" stroke-width="1.5"/>
    <circle cx="170" cy="676" r="22" fill="#000"/>
    <circle cx="170" cy="676" r="3" fill="#D4AF37"/>
    <path id="topArc" d="M138,676 A32,32 0 0 1 202,676" fill="none"/>
    <text font-size="9" font-weight="700" fill="#000" letter-spacing="2"><textPath href="#topArc" startOffset="50%" text-anchor="middle">LO-FI NIGHTS</textPath></text>
  </g>

  <!-- MOOD TAG black bar -->
  <rect x="216" y="640" width="118" height="20" rx="2" fill="#000"/>
  <text x="275" y="654" font-size="10" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="2">CHILL · FOCUS</text>

  <!-- DESCRIPTION area -->
  <text x="216" y="678" font-size="10" font-weight="700" fill="#000">Synced lyrics available.</text>
  <text x="216" y="692" font-size="9" fill="#333">Tap card to flip and read along.</text>
  <text x="216" y="706" font-size="9" fill="#333">Swipe up to favorite.</text>
  <text x="334" y="722" font-size="7" fill="#888" text-anchor="end">No. 0003</text>

  <!-- BOTTOM STAT PILLS -->
  <g transform="translate(78,734)">
    <rect width="116" height="34" rx="6" fill="#000"/>
    <text x="16" y="23" font-size="14" fill="#D4AF37">⏱</text>
    <text x="100" y="24" font-size="16" font-weight="800" fill="#fff" text-anchor="end">3:42</text>
  </g>
  <g transform="translate(202,734)">
    <rect width="116" height="34" rx="6" fill="#000"/>
    <text x="14" y="24" font-size="16" font-weight="800" fill="#fff">87</text>
    <text x="44" y="23" font-size="11" fill="#bbb">plays</text>
    <polygon points="100,12 100,24 108,18" fill="#D4AF37"/>
  </g>

  <!-- mini controls below card -->
  <g transform="translate(0,792)">
    <g transform="translate(110,4)" fill="#fff"><polygon points="14,0 14,20 0,10"/><rect x="14" width="3" height="20"/></g>
    <circle cx="195" cy="14" r="22" fill="#D4AF37"/>
    <polygon points="189,4 189,24 207,14" fill="#000"/>
    <g transform="translate(254,4)" fill="#fff"><polygon points="0,0 0,20 14,10"/><rect x="14" width="3" height="20"/></g>
  </g>
  <text x="195" y="832" font-size="9" fill="#666" text-anchor="middle" font-style="italic">Tap to flip · Swipe ↓ to exit</text>
</svg>
