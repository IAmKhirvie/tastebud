<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="-apple-system, SF Pro Display, Segoe UI, Roboto, sans-serif">
  <defs>
    <pattern id="gridPlus" x="0" y="0" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M26,22 L30,22 M28,20 L28,24" stroke="#3a3a3a" stroke-width="1"/>
    </pattern>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#7a5d12"/>
    </linearGradient>
    <linearGradient id="tape" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <filter id="cardShadow"><feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000" flood-opacity="0.55"/></filter>
  </defs>

  <rect width="390" height="844" fill="#0a0a0a"/>
  <rect width="390" height="844" fill="url(#gridPlus)"/>

  <text x="30" y="32" font-size="14" font-weight="600" fill="#fff">9:41</text>
  <g transform="translate(310,22)" fill="#fff"><rect y="2" width="14" height="10" rx="1"/><rect x="18" width="3" height="12" rx="0.5"/><rect x="24" y="2" width="20" height="8" rx="2"/></g>
  <text x="30" y="74" font-size="22" fill="#fff">⌄</text>
  <text x="195" y="74" font-size="10" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="2">TASTE DECK · MIXTAPE</text>
  <text x="360" y="74" font-size="20" fill="#fff" text-anchor="end">⋯</text>

  <!-- CARD body -->
  <g filter="url(#cardShadow)">
    <rect x="32" y="106" width="326" height="660" rx="20" fill="#FFFFFF"/>
  </g>

  <!-- Top crest -->
  <g transform="translate(195,116)">
    <path d="M-2,18 Q-30,-2 -68,2 Q-58,18 -38,26 Q-20,30 -8,26 Z" fill="url(#gold)" stroke="#5a4612" stroke-width="0.8"/>
    <path d="M2,18 Q30,-2 68,2 Q58,18 38,26 Q20,30 8,26 Z" fill="url(#gold)" stroke="#5a4612" stroke-width="0.8"/>
    <polygon points="0,-8 13,0 13,16 0,24 -13,16 -13,0" fill="url(#gold)" stroke="#5a4612" stroke-width="1"/>
  </g>

  <!-- Sticker-style title (handwritten mixtape vibe) -->
  <g transform="rotate(-1 195 180)">
    <rect x="62" y="160" width="266" height="46" fill="#FFFFFF" stroke="#000" stroke-width="2"/>
    <text x="195" y="190" font-size="22" font-weight="900" fill="#000" text-anchor="middle" letter-spacing="2">MIDNIGHT DRIVE</text>
  </g>

  <!-- CASSETTE BODY -->
  <g transform="translate(195,400)">
    <!-- shell -->
    <rect x="-150" y="-100" width="300" height="200" rx="14" fill="url(#tape)" stroke="#000" stroke-width="1.5"/>
    <!-- label area -->
    <rect x="-130" y="-90" width="260" height="100" rx="6" fill="#FFFFFF"/>
    <text x="-120" y="-72" font-size="8" font-weight="800" fill="#000" letter-spacing="2">SIDE A · 90 MIN</text>
    <line x1="-120" y1="-66" x2="120" y2="-66" stroke="#000" stroke-width="0.6"/>
    <text x="-120" y="-50" font-size="11" font-weight="700" fill="#000">01. Empty Roads</text>
    <text x="-120" y="-36" font-size="11" font-weight="700" fill="#000">02. Late Hours</text>
    <text x="-120" y="-22" font-size="12" font-weight="900" fill="#D4AF37">▸ 03. Midnight Drive</text>
    <text x="-120" y="-8" font-size="11" fill="#888">04. Streetlights</text>
    <text x="120" y="-50" font-size="10" font-weight="700" fill="#000" text-anchor="end">3:42</text>
    <text x="120" y="-36" font-size="10" font-weight="700" fill="#000" text-anchor="end">4:08</text>
    <text x="120" y="-22" font-size="10" font-weight="900" fill="#D4AF37" text-anchor="end">PLAYING</text>
    <text x="120" y="-8" font-size="10" fill="#888" text-anchor="end">3:55</text>

    <!-- Tape window with reels -->
    <rect x="-120" y="20" width="240" height="70" rx="6" fill="#0a0a0a" stroke="#000"/>
    <!-- Left reel -->
    <circle cx="-70" cy="55" r="26" fill="#1a1a1a" stroke="#333"/>
    <g transform="translate(-70,55)" fill="#000">
      <rect x="-3" y="-22" width="6" height="44" rx="1"/>
      <rect x="-22" y="-3" width="44" height="6" rx="1"/>
      <g transform="rotate(45)"><rect x="-3" y="-22" width="6" height="44" rx="1"/><rect x="-22" y="-3" width="44" height="6" rx="1"/></g>
    </g>
    <circle cx="-70" cy="55" r="6" fill="#D4AF37"/>
    <!-- Right reel -->
    <circle cx="70" cy="55" r="26" fill="#1a1a1a" stroke="#333"/>
    <g transform="translate(70,55)" fill="#000">
      <rect x="-3" y="-22" width="6" height="44" rx="1"/>
      <rect x="-22" y="-3" width="44" height="6" rx="1"/>
      <g transform="rotate(45)"><rect x="-3" y="-22" width="6" height="44" rx="1"/><rect x="-22" y="-3" width="44" height="6" rx="1"/></g>
    </g>
    <circle cx="70" cy="55" r="6" fill="#D4AF37"/>
    <!-- Tape strip -->
    <path d="M-48,40 Q0,30 48,40" fill="none" stroke="#D4AF37" stroke-width="2"/>

    <!-- Bottom holes -->
    <circle cx="-90" cy="100" r="3" fill="#000"/>
    <circle cx="90" cy="100" r="3" fill="#000"/>
  </g>

  <!-- Mood bar -->
  <rect x="48" y="540" width="294" height="24" rx="2" fill="#000"/>
  <text x="195" y="556" font-size="11" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing="3">CHILL · FOCUS · LATE NIGHT</text>

  <!-- Description -->
  <text x="48" y="588" font-size="11" font-weight="700" fill="#000">Synced lyrics available.</text>
  <text x="48" y="604" font-size="10" fill="#444">Tap card to flip — read along.</text>
  <text x="48" y="620" font-size="10" fill="#444">Swipe ↑ to favorite · Hold for actions.</text>

  <!-- Bottom stat pills -->
  <g transform="translate(48,648)">
    <rect width="138" height="38" rx="6" fill="#000"/>
    <text x="14" y="25" font-size="15" fill="#D4AF37">⏱</text>
    <text x="124" y="26" font-size="17" font-weight="800" fill="#fff" text-anchor="end">3:42</text>
  </g>
  <g transform="translate(204,648)">
    <rect width="138" height="38" rx="6" fill="#000"/>
    <text x="14" y="26" font-size="17" font-weight="800" fill="#fff">87</text>
    <text x="46" y="25" font-size="11" fill="#bbb">plays</text>
    <polygon points="120,12 120,26 130,19" fill="#D4AF37"/>
  </g>

  <!-- Bottom strip: barcode -->
  <g transform="translate(48,712)">
    <g fill="#000">
      <rect width="2" height="22"/><rect x="4" width="1" height="22"/><rect x="7" width="3" height="22"/>
      <rect x="12" width="1" height="22"/><rect x="15" width="2" height="22"/><rect x="19" width="1" height="22"/>
      <rect x="22" width="3" height="22"/><rect x="27" width="2" height="22"/><rect x="31" width="1" height="22"/>
      <rect x="34" width="2" height="22"/><rect x="38" width="3" height="22"/>
    </g>
    <text x="294" y="22" font-size="9" font-weight="700" fill="#000" text-anchor="end">TB · No. 0003 · LO-FI NIGHTS</text>
  </g>

  <!-- Corner LRC + Heart -->
  <rect x="48" y="124" width="44" height="20" rx="10" fill="#000"/>
  <text x="70" y="138" font-size="9" font-weight="800" fill="#D4AF37" text-anchor="middle">LRC ✓</text>
  <circle cx="332" cy="134" r="14" fill="#000"/>
  <text x="332" y="140" font-size="14" fill="#EC407A" text-anchor="middle">♥</text>

  <!-- Mini controls -->
  <g transform="translate(0,792)">
    <g transform="translate(110,4)" fill="#fff"><polygon points="14,0 14,20 0,10"/><rect x="14" width="3" height="20"/></g>
    <circle cx="195" cy="14" r="22" fill="#D4AF37"/>
    <polygon points="189,4 189,24 207,14" fill="#000"/>
    <g transform="translate(254,4)" fill="#fff"><polygon points="0,0 0,20 14,10"/><rect x="14" width="3" height="20"/></g>
  </g>
  <text x="195" y="832" font-size="9" fill="#666" text-anchor="middle" font-style="italic">Tap to flip · Swipe ↓ to exit</text>
</svg>
