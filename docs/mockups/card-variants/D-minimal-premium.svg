<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="-apple-system, SF Pro Display, Segoe UI, Roboto, sans-serif">
  <defs>
    <pattern id="gridPlus" x="0" y="0" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M26,22 L30,22 M28,20 L28,24" stroke="#3a3a3a" stroke-width="1"/>
    </pattern>
    <linearGradient id="holo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9be3ff"/>
      <stop offset="35%" stop-color="#d6b8ff"/>
      <stop offset="70%" stop-color="#ffb3da"/>
      <stop offset="100%" stop-color="#ffe5a3"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#7a5d12"/>
    </linearGradient>
    <filter id="cardShadow"><feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000" flood-opacity="0.55"/></filter>
  </defs>

  <rect width="390" height="844" fill="#0a0a0a"/>
  <rect width="390" height="844" fill="url(#gridPlus)"/>

  <text x="30" y="32" font-size="14" font-weight="600" fill="#fff">9:41</text>
  <g transform="translate(310,22)" fill="#fff"><rect y="2" width="14" height="10" rx="1"/><rect x="18" width="3" height="12" rx="0.5"/><rect x="24" y="2" width="20" height="8" rx="2"/></g>
  <text x="30" y="74" font-size="22" fill="#fff">⌄</text>
  <text x="195" y="74" font-size="10" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="2">TASTE DECK</text>
  <text x="360" y="74" font-size="20" fill="#fff" text-anchor="end">⋯</text>

  <!-- CARD body - clean rect -->
  <g filter="url(#cardShadow)">
    <rect x="36" y="118" width="318" height="664" rx="18" fill="#FFFFFF"/>
  </g>
  <rect x="46" y="128" width="298" height="644" rx="12" fill="none" stroke="#000" stroke-width="0.6" opacity="0.15"/>

  <!-- Gold crest only (top center, breaks the line) -->
  <g transform="translate(195,118)">
    <path d="M-2,18 Q-30,-2 -68,2 Q-58,18 -38,26 Q-20,30 -8,26 Z" fill="url(#gold)" stroke="#5a4612" stroke-width="0.8"/>
    <path d="M2,18 Q30,-2 68,2 Q58,18 38,26 Q20,30 8,26 Z" fill="url(#gold)" stroke="#5a4612" stroke-width="0.8"/>
    <polygon points="0,-8 13,0 13,16 0,24 -13,16 -13,0" fill="url(#gold)" stroke="#5a4612" stroke-width="1"/>
    <circle cx="0" cy="7" r="2.5" fill="#fff"/>
  </g>

  <!-- TITLE (no banner, just bold typography) -->
  <text x="195" y="184" font-size="11" font-weight="700" fill="#888" text-anchor="middle" letter-spacing="4">LO-FI NIGHTS · 2024</text>
  <text x="195" y="216" font-size="28" font-weight="900" fill="#000" text-anchor="middle" letter-spacing="-0.5">Midnight Drive</text>

  <!-- Thin gold underline -->
  <rect x="170" y="226" width="50" height="2" rx="1" fill="#D4AF37"/>

  <!-- HUGE holographic art window -->
  <g>
    <rect x="56" y="248" width="278" height="350" rx="12" fill="url(#holo)"/>
    <polygon points="56,420 130,248 200,248 110,598 56,598" fill="#fff" opacity="0.16"/>
    <polygon points="230,248 290,248 240,598 200,598" fill="#000" opacity="0.10"/>
    <g opacity="0.3" stroke="#fff" stroke-width="0.5">
      <line x1="56" y1="290" x2="334" y2="282"/>
      <line x1="56" y1="350" x2="334" y2="344"/>
      <line x1="56" y1="420" x2="334" y2="418"/>
      <line x1="56" y1="490" x2="334" y2="494"/>
      <line x1="56" y1="560" x2="334" y2="568"/>
    </g>
    <text x="195" y="450" font-size="220" fill="#fff" opacity="0.5" text-anchor="middle" font-weight="100">♪</text>

    <!-- Corner badges in art window -->
    <rect x="68" y="262" width="44" height="20" rx="10" fill="#000"/>
    <text x="90" y="276" font-size="9" font-weight="800" fill="#D4AF37" text-anchor="middle">LRC ✓</text>
    <circle cx="320" cy="272" r="14" fill="#000"/>
    <text x="320" y="278" font-size="14" fill="#EC407A" text-anchor="middle">♥</text>

    <!-- Cost pill -->
    <g transform="translate(308,560)">
      <rect width="22" height="28" rx="11" fill="#000"/>
      <text x="11" y="20" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">3</text>
    </g>
  </g>

  <!-- Mood chips (light, minimal) -->
  <g transform="translate(56,618)">
    <rect width="68" height="26" rx="13" fill="#fff" stroke="#000" stroke-width="1.2"/>
    <circle cx="14" cy="13" r="5" fill="#87CEEB"/>
    <text x="40" y="17" font-size="11" font-weight="700" fill="#000" text-anchor="middle">Chill</text>
  </g>
  <g transform="translate(132,618)">
    <rect width="68" height="26" rx="13" fill="#fff" stroke="#000" stroke-width="1.2"/>
    <circle cx="14" cy="13" r="5" fill="#4CAF50"/>
    <text x="40" y="17" font-size="11" font-weight="700" fill="#000" text-anchor="middle">Focus</text>
  </g>
  <g transform="translate(208,618)">
    <rect width="86" height="26" rx="13" fill="#fff" stroke="#000" stroke-width="1.2"/>
    <circle cx="14" cy="13" r="5" fill="#1E5AAF"/>
    <text x="50" y="17" font-size="11" font-weight="700" fill="#000" text-anchor="middle">Late Night</text>
  </g>

  <!-- Stat row -->
  <g transform="translate(56,662)">
    <rect width="135" height="44" rx="8" fill="#000"/>
    <text x="14" y="29" font-size="16" fill="#D4AF37">⏱</text>
    <text x="40" y="22" font-size="9" font-weight="700" fill="#888" letter-spacing="2">DURATION</text>
    <text x="40" y="38" font-size="15" font-weight="800" fill="#fff">3:42</text>
  </g>
  <g transform="translate(199,662)">
    <rect width="135" height="44" rx="8" fill="#000"/>
    <polygon points="14,18 14,32 24,25" fill="#D4AF37"/>
    <text x="32" y="22" font-size="9" font-weight="700" fill="#888" letter-spacing="2">PLAYS</text>
    <text x="32" y="38" font-size="15" font-weight="800" fill="#fff">87</text>
    <text x="124" y="38" font-size="10" fill="#666" text-anchor="end">+12 wk</text>
  </g>

  <!-- Footer -->
  <line x1="56" y1="724" x2="334" y2="724" stroke="#000" opacity="0.1"/>
  <text x="56" y="744" font-size="9" font-weight="700" fill="#000" letter-spacing="2">TASTEBUD</text>
  <text x="334" y="744" font-size="9" fill="#888" text-anchor="end">No. 0003 / 47</text>
  <text x="56" y="762" font-size="8" fill="#aaa">Tap to flip · Hold for actions</text>

  <!-- Mini controls below -->
  <g transform="translate(0,800)">
    <g transform="translate(110,4)" fill="#fff"><polygon points="14,0 14,20 0,10"/><rect x="14" width="3" height="20"/></g>
    <circle cx="195" cy="14" r="22" fill="#D4AF37"/>
    <polygon points="189,4 189,24 207,14" fill="#000"/>
    <g transform="translate(254,4)" fill="#fff"><polygon points="0,0 0,20 14,10"/><rect x="14" width="3" height="20"/></g>
  </g>
</svg>
