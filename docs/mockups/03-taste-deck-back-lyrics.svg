<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="-apple-system, SF Pro Display, Segoe UI, Roboto, sans-serif">
  <defs>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Device frame -->
  <rect x="0" y="0" width="390" height="844" rx="44" fill="#000"/>
  <rect x="6" y="6" width="378" height="832" rx="38" fill="#FFFFFF"/>

  <!-- Dynamic Island -->
  <rect x="155" y="14" width="80" height="22" rx="11" fill="#000"/>

  <!-- Status bar -->
  <text x="30" y="32" font-size="14" font-weight="600" fill="#000">9:41</text>
  <g transform="translate(310,22)" fill="#000">
    <rect x="0" y="2" width="14" height="10" rx="1"/>
    <rect x="18" y="0" width="3" height="12" rx="0.5"/>
    <rect x="24" y="2" width="20" height="8" rx="2"/>
  </g>

  <!-- Top bar -->
  <text x="30" y="74" font-size="22" fill="#000">⌄</text>
  <text x="195" y="74" font-size="10" font-weight="700" fill="#000" text-anchor="middle" letter-spacing="2">LYRICS · CARD BACK</text>
  <text x="195" y="90" font-size="12" fill="#888" text-anchor="middle">Midnight Drive · Lo-fi Nights</text>
  <text x="360" y="74" font-size="18" fill="#000" text-anchor="end">↻</text>

  <!-- Background card hints (deck stack) -->
  <g transform="rotate(-3 195 380)">
    <rect x="36" y="118" width="318" height="600" rx="28" fill="#FAFAFA" stroke="#EEE"/>
  </g>
  <g transform="rotate(2 195 380)">
    <rect x="32" y="114" width="326" height="608" rx="28" fill="#F4F4F4" stroke="#E0E0E0"/>
  </g>

  <!-- MAIN CARD (back) -->
  <g filter="url(#softShadow)">
    <rect x="24" y="110" width="342" height="618" rx="30" fill="#FFFFFF" stroke="#000" stroke-width="1.5"/>
  </g>

  <!-- LYRICS TITLE STRIP -->
  <text x="48" y="148" font-size="10" font-weight="700" fill="#D4AF37" letter-spacing="1.5">SYNCED LYRICS</text>
  <text x="48" y="170" font-size="22" font-weight="800" fill="#000" letter-spacing="-0.5">Midnight Drive</text>
  <line x1="48" y1="184" x2="342" y2="184" stroke="#EEE"/>

  <!-- Synced lyrics body -->
  <text x="195" y="220" font-size="14" fill="#CCC" text-anchor="middle">[01:02]  Headlights paint the road again</text>
  <text x="195" y="250" font-size="14" fill="#999" text-anchor="middle">[01:08]  Empty highway, just my friend</text>
  <text x="195" y="280" font-size="14" fill="#666" text-anchor="middle">[01:14]  The radio hums softly low</text>

  <!-- Currently highlighted line — gold accent (10%) -->
  <g>
    <rect x="48" y="298" width="294" height="50" rx="14" fill="#FFF8E1" stroke="#D4AF37" stroke-width="1.5"/>
    <text x="195" y="330" font-size="18" font-weight="800" fill="#000" text-anchor="middle">[01:18]  Midnight drive, where do we go</text>
  </g>

  <text x="195" y="376" font-size="14" fill="#666" text-anchor="middle">[01:24]  City lights begin to fade</text>
  <text x="195" y="406" font-size="14" fill="#999" text-anchor="middle">[01:30]  Memories the night has made</text>
  <text x="195" y="436" font-size="14" fill="#BBB" text-anchor="middle">[01:36]  We'll keep driving 'til the dawn</text>
  <text x="195" y="466" font-size="14" fill="#DDD" text-anchor="middle">[01:42]  Singing softly, carrying on</text>
  <text x="195" y="496" font-size="14" fill="#EEE" text-anchor="middle">[01:48]  ...</text>

  <!-- Source attribution -->
  <line x1="48" y1="528" x2="342" y2="528" stroke="#EEE"/>
  <text x="48" y="550" font-size="11" fill="#888">Lyrics from</text>
  <text x="106" y="550" font-size="11" font-weight="700" fill="#000">lrclib.net</text>
  <text x="48" y="566" font-size="9" fill="#AAA">Cached locally · removed on uninstall</text>

  <!-- Import alternate -->
  <rect x="48" y="582" width="294" height="36" rx="18" fill="#FFFFFF" stroke="#000" stroke-dasharray="4,4"/>
  <text x="195" y="605" font-size="11" font-weight="600" fill="#000" text-anchor="middle">+ Import a different .lrc file</text>

  <!-- Mini playback controls -->
  <g transform="translate(120,634)" fill="#000">
    <g transform="translate(0,8)">
      <polygon points="14,0 14,16 0,8"/>
      <rect x="14" y="0" width="3" height="16"/>
    </g>
    <circle cx="60" cy="16" r="18" fill="#D4AF37"/>
    <polygon points="55,8 55,24 73,16" fill="#000"/>
    <g transform="translate(105,8)">
      <polygon points="0,0 0,16 14,8"/>
      <rect x="14" y="0" width="3" height="16"/>
    </g>
  </g>

  <!-- Progress -->
  <rect x="56" y="690" width="278" height="3" rx="1.5" fill="#EEE"/>
  <rect x="56" y="690" width="98" height="3" rx="1.5" fill="#000"/>
  <circle cx="154" cy="692" r="5" fill="#D4AF37"/>
  <text x="56" y="710" font-size="10" fill="#888">1:18</text>
  <text x="334" y="710" font-size="10" fill="#888" text-anchor="end">3:42</text>

  <!-- Gesture arrows on card edges -->
  <text x="14" y="420" font-size="28" fill="#000" opacity="0.15">‹</text>
  <text x="368" y="420" font-size="28" fill="#000" opacity="0.15" text-anchor="end">›</text>

  <!-- Bottom area -->
  <g transform="translate(115,766)">
    <rect width="160" height="32" rx="16" fill="#F4F4F4"/>
    <text x="80" y="20" font-size="11" font-weight="600" fill="#000" text-anchor="middle">Tap card to flip back</text>
  </g>
  <rect x="135" y="822" width="120" height="4" rx="2" fill="#000" opacity="0.6"/>
</svg>
