<svg xmlns="http://www.w3.org/2000/svg" width="380" height="800" viewBox="0 0 380 800" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="0" y="0" width="380" height="800" rx="36" fill="#000"/>
  <rect x="8" y="8" width="364" height="784" rx="30" fill="#0a0a0a"/>

  <!-- Dimmed background hint of the card -->
  <rect x="30" y="120" width="320" height="520" rx="24" fill="#1a1a1a" opacity="0.5"/>
  <rect x="55" y="148" width="270" height="270" rx="16" fill="#D4AF37" opacity="0.2"/>
  <text x="190" y="450" font-size="22" font-weight="700" fill="#fff" opacity="0.4" text-anchor="middle">Midnight Drive</text>

  <!-- Dim overlay -->
  <rect x="8" y="8" width="364" height="784" rx="30" fill="#000" opacity="0.55"/>

  <text x="28" y="36" font-size="13" font-weight="600" fill="#fff">9:41</text>
  <text x="328" y="36" font-size="13" fill="#fff">●●●●</text>

  <!-- Action sheet -->
  <rect x="20" y="280" width="340" height="460" rx="24" fill="#1a1a1a" stroke="#D4AF37" stroke-width="1"/>
  <rect x="170" y="296" width="40" height="4" rx="2" fill="#444"/>

  <text x="190" y="332" font-size="11" font-weight="600" fill="#D4AF37" text-anchor="middle" letter-spacing="2">QUICK ACTIONS</text>
  <text x="190" y="354" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Midnight Drive</text>
  <line x1="40" y1="372" x2="340" y2="372" stroke="#222"/>

  <!-- Menu items -->
  <g transform="translate(40,388)">
    <text x="0" y="16" font-size="18" fill="#EC407A">♥</text>
    <text x="36" y="18" font-size="14" fill="#fff">Favorite</text>
    <text x="280" y="18" font-size="12" fill="#666">●</text>
  </g>

  <g transform="translate(40,424)">
    <text x="0" y="16" font-size="16" fill="#D4AF37">＋</text>
    <text x="36" y="18" font-size="14" fill="#fff">Add to playlist</text>
    <text x="288" y="18" font-size="12" fill="#666">›</text>
  </g>

  <g transform="translate(40,460)">
    <text x="0" y="16" font-size="16" fill="#D4AF37">⇥</text>
    <text x="36" y="18" font-size="14" fill="#fff">Add to queue</text>
  </g>

  <g transform="translate(40,496)">
    <text x="0" y="16" font-size="16" fill="#D4AF37">▶</text>
    <text x="36" y="18" font-size="14" fill="#fff">Play next</text>
  </g>

  <line x1="40" y1="520" x2="340" y2="520" stroke="#222"/>

  <g transform="translate(40,536)">
    <circle cx="6" cy="12" r="6" fill="#87CEEB"/>
    <text x="36" y="18" font-size="14" fill="#fff">Edit moods</text>
    <text x="160" y="18" font-size="11" fill="#666">Chill, Focus</text>
    <text x="288" y="18" font-size="12" fill="#666">›</text>
  </g>

  <g transform="translate(40,572)">
    <text x="0" y="16" font-size="16" fill="#D4AF37">🖼</text>
    <text x="36" y="18" font-size="14" fill="#fff">Change thumbnail</text>
  </g>

  <g transform="translate(40,608)">
    <text x="0" y="16" font-size="16" fill="#D4AF37">🎵</text>
    <text x="36" y="18" font-size="14" fill="#fff">Add or edit lyrics</text>
  </g>

  <g transform="translate(40,644)">
    <text x="0" y="16" font-size="16" fill="#D4AF37">ⓘ</text>
    <text x="36" y="18" font-size="14" fill="#fff">View song details</text>
  </g>

  <line x1="40" y1="668" x2="340" y2="668" stroke="#222"/>

  <g transform="translate(40,684)">
    <text x="0" y="16" font-size="16" fill="#FF5252">✕</text>
    <text x="36" y="18" font-size="14" fill="#FF5252">Remove from library</text>
  </g>

  <!-- Cancel -->
  <rect x="60" y="750" width="260" height="40" rx="20" fill="#000" stroke="#333"/>
  <text x="190" y="775" font-size="14" fill="#fff" text-anchor="middle">Cancel</text>
</svg>
