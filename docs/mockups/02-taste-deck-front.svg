<svg xmlns="http://www.w3.org/2000/svg" width="380" height="800" viewBox="0 0 380 800" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#000"/>
    </linearGradient>
    <linearGradient id="albumArt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
  </defs>

  <!-- Phone frame -->
  <rect x="0" y="0" width="380" height="800" rx="36" fill="#000"/>
  <rect x="8" y="8" width="364" height="784" rx="30" fill="#0a0a0a"/>

  <!-- Status bar -->
  <text x="28" y="36" font-size="13" font-weight="600" fill="#fff">9:41</text>
  <text x="328" y="36" font-size="13" fill="#fff">●●●●</text>

  <!-- Top label -->
  <text x="28" y="74" font-size="11" font-weight="600" fill="#D4AF37" letter-spacing="2">TASTE DECK</text>
  <text x="28" y="94" font-size="22" font-weight="700" fill="#fff">Card 3 of 47</text>
  <text x="332" y="80" font-size="20" fill="#fff">⋯</text>

  <!-- Background card hints (deck effect) -->
  <rect x="44" y="128" width="292" height="500" rx="22" fill="#1a1a1a" opacity="0.4" transform="rotate(-2 190 378)"/>
  <rect x="38" y="124" width="304" height="510" rx="22" fill="#1a1a1a" opacity="0.6" transform="rotate(1 190 379)"/>

  <!-- Main card front -->
  <rect x="30" y="120" width="320" height="520" rx="24" fill="url(#cardBg)" stroke="#D4AF37" stroke-width="1.5"/>

  <!-- Album art -->
  <rect x="55" y="148" width="270" height="270" rx="16" fill="url(#albumArt)"/>
  <text x="170" y="295" font-size="60" fill="#fff" opacity="0.3">♪</text>

  <!-- Lyrics indicator badge -->
  <rect x="290" y="160" width="48" height="22" rx="11" fill="#000" opacity="0.7"/>
  <text x="299" y="175" font-size="10" fill="#D4AF37">LRC ✓</text>

  <!-- Favorite heart (top-left of art) -->
  <circle cx="80" cy="172" r="16" fill="#000" opacity="0.5"/>
  <text x="71" y="178" font-size="16" fill="#EC407A">♥</text>

  <!-- Song info -->
  <text x="190" y="450" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">Midnight Drive</text>
  <text x="190" y="472" font-size="14" fill="#bbb" text-anchor="middle">Lo-fi Nights</text>
  <text x="190" y="490" font-size="11" fill="#888" text-anchor="middle">Late Hours · 2024 · 3:42</text>

  <!-- Mood chips -->
  <g transform="translate(80,506)">
    <rect width="64" height="24" rx="12" fill="#87CEEB" opacity="0.2" stroke="#87CEEB"/>
    <circle cx="12" cy="12" r="4" fill="#87CEEB"/>
    <text x="22" y="16" font-size="11" fill="#87CEEB">Chill</text>
  </g>
  <g transform="translate(152,506)">
    <rect width="64" height="24" rx="12" fill="#4CAF50" opacity="0.2" stroke="#4CAF50"/>
    <circle cx="12" cy="12" r="4" fill="#4CAF50"/>
    <text x="22" y="16" font-size="11" fill="#4CAF50">Focus</text>
  </g>
  <g transform="translate(224,506)">
    <rect width="76" height="24" rx="12" fill="#1E5AAF" opacity="0.2" stroke="#1E5AAF"/>
    <circle cx="12" cy="12" r="4" fill="#1E5AAF"/>
    <text x="22" y="16" font-size="11" fill="#7FB3FF">Late Night</text>
  </g>

  <!-- Playback controls -->
  <g transform="translate(50,560)">
    <text x="0" y="20" font-size="22" fill="#fff">⏮</text>
    <text x="60" y="20" font-size="20" fill="#fff">⏪</text>
    <circle cx="140" cy="14" r="22" fill="#D4AF37"/>
    <text x="132" y="22" font-size="20" fill="#000">▶</text>
    <text x="200" y="20" font-size="20" fill="#fff">⏩</text>
    <text x="260" y="20" font-size="22" fill="#fff">⏭</text>
  </g>

  <!-- Progress bar -->
  <rect x="55" y="612" width="270" height="3" rx="1.5" fill="#333"/>
  <rect x="55" y="612" width="95" height="3" rx="1.5" fill="#D4AF37"/>
  <text x="55" y="628" font-size="10" fill="#888">1:18</text>
  <text x="306" y="628" font-size="10" fill="#888">3:42</text>

  <!-- Gesture hints -->
  <text x="190" y="678" font-size="10" fill="#666" text-anchor="middle" font-style="italic">Tap to flip • Swipe up to favorite</text>
  <text x="190" y="694" font-size="10" fill="#666" text-anchor="middle" font-style="italic">Swipe ← prev • Swipe → next • Hold for menu</text>

  <!-- Swipe arrows -->
  <text x="18" y="384" font-size="24" fill="#D4AF37" opacity="0.4">‹</text>
  <text x="350" y="384" font-size="24" fill="#D4AF37" opacity="0.4">›</text>

  <!-- Bottom Nav -->
  <rect x="0" y="720" width="380" height="80" fill="#0a0a0a" stroke="#222" stroke-width="1"/>
  <text x="42" y="755" font-size="22" opacity="0.5">🏠</text>
  <text x="36" y="775" font-size="10" fill="#666">Home</text>

  <text x="128" y="755" font-size="22">🎴</text>
  <text x="118" y="775" font-size="10" font-weight="700" fill="#D4AF37">Taste Deck</text>

  <text x="218" y="755" font-size="22" opacity="0.5">📚</text>
  <text x="208" y="775" font-size="10" fill="#666">Library</text>

  <text x="310" y="755" font-size="22" opacity="0.5">👤</text>
  <text x="304" y="775" font-size="10" fill="#666">Profile</text>
</svg>
