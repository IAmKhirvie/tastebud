name: tastebud
description: "TasteBud — Music Taste Made for Your Earbuds. Offline-first mobile audio player and music taste organizer."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Audio playback
  just_audio: ^0.9.40
  audio_service: ^0.18.15
  audio_session: ^0.1.21

  # State management
  flutter_riverpod: ^2.5.1

  # Local database & storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2

  # File access & metadata
  file_picker: ^8.1.2
  permission_handler: ^11.3.1
  on_audio_query: ^2.9.0

  # Online lookup
  http: ^1.2.2
  cached_network_image: ^3.4.1

  # Lyrics
  flutter_lyric: ^2.0.4+6

  # UI / Design — Taste Deck
  flutter_card_swiper: ^7.0.1
  flip_card: ^0.7.0
  flutter_slidable: ^3.1.1
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  dynamic_color: ^1.7.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.0
  equatable: ^2.0.5
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
